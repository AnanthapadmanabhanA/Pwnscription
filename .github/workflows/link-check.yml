name: Link check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday mornings, catch links that rot over time
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --max-concurrency 4 './**/*.md'
          fail: false
